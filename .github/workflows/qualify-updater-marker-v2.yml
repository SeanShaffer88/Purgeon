name: Updater marker coverage qualification
on:
  push:
    branches: [qualification/updater-marker-v2-c92e21e-system-temp]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc
          components: llvm-tools-preview
      - name: Build and verify coverage on the qualification commit
        shell: pwsh
        run: ./.github/qualification/updater-marker/Collect-NativeCoverage.ps1
      - name: Upload bounded sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: updater-marker-v2-qualification
          path: ${{ runner.temp }}/updater-marker-v2-public/evidence.json
          if-no-files-found: error
          retention-days: 1
