# Builds the Windows installer and portable package. Pushing a tag like v0.8.0
# publishes them as a GitHub Release; every push and PR just runs the safety tests.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  # Runs the safety test suite on a matrix of Windows versions so a release is only as good as
  # its weakest supported platform. Purgeon targets Windows 10 and 11 (64-bit).
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2019]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Safety tests
        run: npm test

  # Builds the app and installer on the newest supported Windows, then publishes a release on tags.
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Safety tests
        run: npm test

      # Optional code signing: if a certificate and password are supplied as secrets the binaries
      # are EV-signed before release. Without a certificate Purgeon ships unsigned and the release
      # notes say so honestly (SmartScreen will warn on unsigned downloads).
      - name: Sign binaries (if certificate available)
        if: env.CODE_SIGN_CERT && env.CODE_SIGN_PASSWORD
        shell: pwsh
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          $certPath = "$env:RUNNER_TEMP/codesign.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CODE_SIGN_CERT))
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) { $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*" -Filter signtool.exe -Recurse | Select-Object -First 1 }
          Get-ChildItem src-tauri/target/release/purgeon.exe, src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            & $signtool sign /f $certPath /p $env:CODE_SIGN_PASSWORD /t http://timestamp.digicert.com /d "Purgeon" $_.FullName
          }

      - name: Build app and installer
        run: npm run dist

      - name: Collect release files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null
          # Universal .exe installer (all architectures) per AGENTS.md naming
          Copy-Item "src-tauri/target/release/bundle/nsis/Purgeon_${version}_x64-setup.exe" "release/Purgeon-Setup.exe"
          # Universal .msi installer (all architectures) per AGENTS.md naming
          Copy-Item "src-tauri/target/release/bundle/msi/Purgeon_${version}_x64.msi" "release/Purgeon-Setup.msi"
          # Portable .zip containing portable versions per architecture per AGENTS.md naming
          Compress-Archive -Path "src-tauri/target/release/bundle/portable/*" -DestinationPath "release/Purgeon-Portable.zip"
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Purgeon-windows
          path: release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Release notes are written manually in the repo (RELEASE_NOTES.md) and copied here,
          # honestly stating whether binaries are signed or unsigned.
          body_path: RELEASE_NOTES.md
          files: |
            release/Purgeon-Setup.exe
            release/Purgeon-Setup.msi
            release/Purgeon-Portable.zip
