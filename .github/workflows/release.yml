# Builds the Windows installer and the portable exe. Pushing a tag like v0.4.0
# publishes them as a GitHub Release; every push to main and every pull request just checks the build.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Safety tests
        run: npm test

      - name: Build app and installer
        run: npm run dist

      - name: Collect release files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/SweepUninstall_${version}_x64-setup.exe" "release/SweepUninstall-Setup-$version.exe"
          Copy-Item "src-tauri/target/release/sweepuninstall.exe" "release/SweepUninstall-Portable-$version.exe"
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SweepUninstall-windows
          path: release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/SweepUninstall-Setup-*.exe
            release/SweepUninstall-Portable-*.exe
