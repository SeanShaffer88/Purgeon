# Every pull request builds and verifies the same two files used by tagged releases.
# Pushing a tag like v1.0.0 publishes them as a GitHub Release; every push and PR runs safety tests.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # Runs the safety test suite on a matrix of Windows versions so a release is only as good as
  # its weakest supported platform. Purgeon targets Windows 10 and 11 (64-bit).
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: JavaScript static and adapter type gates
        run: npm run lint && npm run typecheck

      - name: Packed core consumer
        run: npm run test:package

      - name: Safety tests
        run: npm test

      - name: Verification helper regression tests (ten consecutive runs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path verification-focused | Out-Null
          foreach ($repeat in 1..10) {
            node --test test/verification-automation.test.js *> "verification-focused/run-$repeat.log"
            if ($LASTEXITCODE) { Get-Content "verification-focused/run-$repeat.log"; exit $LASTEXITCODE }
          }
      - name: Deterministic backend benchmarks (ten fresh-process repeats)
        run: node scripts/benchmark-backend.mjs backend-benchmark.json 10
      - name: Upload backend benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-benchmark-${{ matrix.os }}
          path: |
            backend-benchmark.json
            verification-focused/
          if-no-files-found: error

  # Builds the app and installer on the newest supported Windows, then publishes a release on tags.
  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: windows-x64
          cache-on-failure: true
      - run: npm ci
      - name: JavaScript static and adapter type gates
        run: npm run lint && npm run typecheck
      - name: Safety tests
        run: npm test
      - name: Build frontend for native checks
        run: npm run build
      - name: Native formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Native lint and tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          foreach ($target in @('x86_64-pc-windows-msvc')) {
            cargo clippy --locked --all-targets --target $target -- -D warnings
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cargo test --locked --all-targets --target $target
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      # The packaging script builds the x64 app, assembles the setup program and
      # the portable zip into release/, writes release-manifest.json and
      # verifies the package itself.
      - name: Build app and release packages
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: npm run dist:windows
      - name: Package verification failure tests
        run: ./scripts/test-package-verifier.ps1 -Directory release -Manifest release-manifest.json
      - name: Fetch pinned prior installer and verify before execution
        shell: pwsh
        run: |
          $prior = Join-Path $env:RUNNER_TEMP 'Purgeon-Setup-1.4.2-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/SeanShaffer88/Purgeon/releases/download/v1.4.2/Purgeon-Setup-x64.exe' -OutFile $prior
          if ((Get-FileHash -LiteralPath $prior -Algorithm SHA256).Hash -ne 'b8ab269d53fde168e6ffa495bba4009e0c576a65b37a4e8e6877b10c69fbe266') {
            throw 'Pinned prior installer SHA256 mismatch.'
          }
      - name: Disposable runner install upgrade reinstall uninstall lifecycle
        shell: pwsh
        run: |
          ./scripts/test-windows-installers.ps1 -Directory release -Manifest release-manifest.json -PriorInstaller "$env:RUNNER_TEMP/Purgeon-Setup-1.4.2-x64.exe" -PriorSha256 b8ab269d53fde168e6ffa495bba4009e0c576a65b37a4e8e6877b10c69fbe266 -PriorVersion 1.4.2 -Reinstall
      - name: Packaged portable CLI (ten consecutive runs)
        shell: pwsh
        run: |
          foreach ($repeat in 1..10) {
            ./scripts/test-packaged-cli.ps1 -Directory release -Manifest release-manifest.json -OutputDirectory "verification/portable-cli-$repeat"
          }
      - name: Upload CLI and lifecycle evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-verification
          path: verification/
          if-no-files-found: warn
      - name: Dependency inventory
        shell: pwsh
        run: |
          npm ls --all --json | Out-File npm-dependencies.json -Encoding utf8
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml | Out-File native-dependencies.json -Encoding utf8
      - name: Upload build artifacts and internal hash evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Purgeon-windows
          if-no-files-found: error
          path: |
            release/
            release-manifest.json
      - name: Re-download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Purgeon-windows
          path: verified
      - name: Verify downloaded contents and hashes
        run: ./scripts/verify-windows-package.ps1 -Directory verified/release -Manifest release-manifest.json

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Purgeon-windows
          path: verified
      - name: Verify publication inputs
        run: ./scripts/verify-windows-package.ps1 -Directory verified/release -Manifest verified/release-manifest.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Release notes are written manually in the repo (RELEASE_NOTES.md) and copied here,
          # honestly stating whether binaries are signed or unsigned.
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: |
            verified/release/Purgeon-Setup-x64.exe
            verified/release/Purgeon-Portable-x64.zip
