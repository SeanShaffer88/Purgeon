# Builds the Windows installer and portable exe. Pushing a tag like v0.2.0 publishes them
# as a GitHub Release; every push to main and every pull request just checks the build.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Safety tests
        run: npm test

      - name: Build installer and portable exe
        run: npm run dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SweepUninstall-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/SweepUninstall-Setup-*.exe
            release/SweepUninstall-Portable-*.exe
