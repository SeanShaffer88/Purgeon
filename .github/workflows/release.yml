# Every pull request builds and verifies the same three files used by tagged releases.
# Pushing a tag like v1.0.0 publishes them as a GitHub Release; every push and PR runs safety tests.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # Runs the safety test suite on a matrix of Windows versions so a release is only as good as
  # its weakest supported platform. Purgeon targets Windows 10 and 11 (64-bit).
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Safety tests
        run: npm test

  # Builds the app and installer on the newest supported Windows, then publishes a release on tags.
  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc,x86_64-pc-windows-msvc
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x86-x64
          cache-on-failure: true
      - run: npm ci
      - name: Safety tests
        run: npm test
      - name: Build frontend for native checks
        run: npm run build
      - name: Native formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Native lint and tests on both architectures
        working-directory: src-tauri
        shell: pwsh
        run: |
          foreach ($target in @('i686-pc-windows-msvc', 'x86_64-pc-windows-msvc')) {
            cargo clippy --locked --all-targets --target $target -- -D warnings
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cargo test --locked --all-targets --target $target
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      # Optional code signing: if a certificate and password are supplied as secrets the binaries
      # are EV-signed before release. Without a certificate Purgeon ships unsigned and the release
      # notes say so honestly (SmartScreen will warn on unsigned downloads).
      - name: Sign binaries (if certificate available)
        if: env.CODE_SIGN_CERT && env.CODE_SIGN_PASSWORD
        shell: pwsh
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          $certPath = "$env:RUNNER_TEMP/codesign.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CODE_SIGN_CERT))
          $signtool = "C:\\Program Files (x86)\\Windows Kits\\10\\bin\\10.0.19041.0\\x64\\signtool.exe"
          if (-not (Test-Path $signtool)) { $signtool = Get-ChildItem -Path "C:\\Program Files (x86)\\Windows Kits\\10\\bin\\*" -Filter signtool.exe -Recurse | Select-Object -First 1 }
          Get-ChildItem src-tauri/target/release/purgeon.exe, src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            & $signtool sign /f $certPath /p $env:CODE_SIGN_PASSWORD /t http://timestamp.digicert.com /d "Purgeon" $_.FullName
          }
      # The packaging script builds both architectures, assembles the universal
      # installer, the MSI and the portable zip into release/, writes
      # release-manifest.json and verifies the package itself.
      - name: Build app and release packages
        run: npm run dist:windows
      - name: Installer dispatch regression probes
        run: ./scripts/test-setup-dispatch.ps1
      - name: Package verification failure tests
        run: ./scripts/test-package-verifier.ps1 -Directory release -Manifest release-manifest.json
      - name: Installer smoke tests (disposable runner only)
        run: ./scripts/test-windows-installers.ps1 -Directory release
      - name: Upload build artifacts and internal hash evidence
        uses: actions/upload-artifact@v7
        with:
          name: Purgeon-windows
          if-no-files-found: error
          path: |
            release/
            release-manifest.json
      - name: Re-download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: Purgeon-windows
          path: verified
      - name: Verify downloaded contents and hashes
        run: ./scripts/verify-windows-package.ps1 -Directory verified/release -Manifest release-manifest.json

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Purgeon-windows
          path: verified
      - name: Verify publication inputs
        run: ./scripts/verify-windows-package.ps1 -Directory verified/release -Manifest verified/release-manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          # Release notes are written manually in the repo (RELEASE_NOTES.md) and copied here,
          # honestly stating whether binaries are signed or unsigned.
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            verified/release/Purgeon-Setup.exe
            verified/release/Purgeon-Setup.msi
            verified/release/Purgeon-Portable.zip
