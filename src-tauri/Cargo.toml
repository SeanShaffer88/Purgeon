[package]
name = "sweepuninstall"
version = "0.6.0"
description = "Windows uninstaller with leftover scanning, install monitoring and backups"
authors = ["Sean Shaffer"]
license = "MIT"
edition = "2021"

[lib]
name = "sweepuninstall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
trash = "5"
winreg = "0.56"
flate2 = "1"
ferrisetw = "1.2.0"

# Small, lean release binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
